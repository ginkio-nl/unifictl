# unifictl configuration — copy to ~/.config/unifictl/config.yaml
#
# Prefer api_key_env over api_key so secrets stay out of this file.
# If you do put keys inline, `chmod 600` the file.

sources:
  # UniFi Site Manager (api.ui.com): one API key covers every console the
  # account can see. Consoles are discovered automatically and queried through
  # the cloud connector — no VPN or LAN access needed.
  # Create a key at https://unifi.ui.com -> Settings -> API Keys.
  - name: msp
    type: sitemanager
    api_key_env: UNIFI_SITEMANAGER_KEY
    # consoles: ["acme*", "contoso-*"]  # optional: glob on console name or ID
    # max_concurrency: 4                # in-flight requests for this key (rate limits)

  # A single console reached directly (LAN/VPN), using a key created in the
  # console's Network app: Settings -> Control Plane -> Integrations.
  - name: lab
    type: local
    url: https://192.168.1.1
    api_key_env: UNIFI_LAB_KEY
    insecure: true # self-signed certificate
    # api_path: /proxy/network/integration  # default for UniFi OS consoles
